name: Ravel
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.38"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0
schemes:
  Ravel:
    build:
      targets:
        Ravel: all
        RavelTests: [test]
        RavelUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Ravel.storekit
    test:
      config: Debug
      targets:
        - RavelTests
        - RavelUITests
targets:
  Ravel:
    type: application
    platform: iOS
    sources:
      - path: Ravel
      - path: Shared
      - path: Ravel.storekit
        buildPhase: none
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.knit
        INFOPLIST_FILE: Ravel/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  RavelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RavelTests
      - path: Ravel.storekit
        buildPhase: resources
    dependencies:
      - target: Ravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.knit.tests
        GENERATE_INFOPLIST_FILE: YES
  RavelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RavelUITests
    dependencies:
      - target: Ravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.knit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ravel
